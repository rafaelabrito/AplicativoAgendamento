version: '3.8'

services:
  # ============= BANCO DE DADOS =============
  postgres:
    image: postgres:16-alpine
    container_name: postgres-agendamentos
    environment:
      POSTGRES_DB: agendamentos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= BACKEND BASE (SUPORTE) =============
  backend-monolith:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-monolith
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Host=host.docker.internal;Port=5432;Database=agendamentos_db;Username=postgres;Password=postgres123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agendamentos-network

  # ============= API GATEWAY (Orquestrador Central) =============
  api-gateway:
    build:
      context: ./backend/microservices/APIGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Services__Usuarios: http://usuarios-service:5001
      Services__Agendamentos: http://agendamentos-service:5002
      Services__Disponibilidade: http://disponibilidade-service:5003
      Services__Relatorios: http://relatorios-service:5004
    depends_on:
      - backend-monolith
      - usuarios-service
      - agendamentos-service
      - disponibilidade-service
      - relatorios-service
    networks:
      - agendamentos-network

  # ============= MICROSERVIÇO: USUÁRIOS =============
  usuarios-service:
    build:
      context: ./backend/microservices/UsuariosService
      dockerfile: Dockerfile
    container_name: usuarios-service
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LegacyApiBaseUrl: http://backend-monolith
    depends_on:
      backend-monolith:
        condition: service_started
    networks:
      - agendamentos-network

  # ============= MICROSERVIÇO: AGENDAMENTOS =============
  agendamentos-service:
    build:
      context: ./backend/microservices/AgendamentosService
      dockerfile: Dockerfile
    container_name: agendamentos-service
    ports:
      - "5002:5002"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LegacyApiBaseUrl: http://backend-monolith
      Services__Disponibilidade: http://disponibilidade-service:5003
    depends_on:
      backend-monolith:
        condition: service_started
    networks:
      - agendamentos-network

  # ============= MICROSERVIÇO: DISPONIBILIDADE =============
  disponibilidade-service:
    build:
      context: ./backend/microservices/DisponibilidadeService
      dockerfile: Dockerfile
    container_name: disponibilidade-service
    ports:
      - "5003:5003"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LegacyApiBaseUrl: http://backend-monolith
    depends_on:
      backend-monolith:
        condition: service_started
    networks:
      - agendamentos-network

  # ============= MICROSERVIÇO: RELATÓRIOS =============
  relatorios-service:
    build:
      context: ./backend/microservices/RelatóriosService
      dockerfile: Dockerfile
    container_name: relatorios-service
    ports:
      - "5004:5004"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LegacyApiBaseUrl: http://backend-monolith
      Services__Agendamentos: http://agendamentos-service:5002
    depends_on:
      backend-monolith:
        condition: service_started
    networks:
      - agendamentos-network

volumes:
  postgres_data:
    driver: local

networks:
  agendamentos-network:
    driver: bridge
